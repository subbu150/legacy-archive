<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentMitra • The Golden Legacy</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #c5a059;
            --gold-bright: #f3d081;
            --bg: #030406;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: #fff;
            overflow-x: hidden;
            background: radial-gradient(circle at 50% -20%, #1a1f2c 0%, #030406 100%);
            min-height: 100vh;
        }

        /* --- LUXURY CURSOR --- */
        .cursor { width: 6px; height: 6px; background: var(--gold-bright); border-radius: 50%; position: fixed; pointer-events: none; z-index: 10000; box-shadow: 0 0 10px var(--gold); }
        .cursor-follower { width: 35px; height: 35px; border: 0.5px solid var(--gold); border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transition: transform 0.2s cubic-bezier(0.17, 0.67, 0.83, 0.67); opacity: 0.4; }

        /* --- BACKGROUND LAYER --- */
        #bg-memory-layer { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .floating-mem {
            position: absolute; opacity: 0.08; filter: grayscale(1) blur(1px);
            animation: drift linear infinite; width: 150px; border-radius: 4px;
        }

        @keyframes drift {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(var(--mx), var(--my)) rotate(10deg); }
        }

        #fw-canvas { position: fixed; inset: 0; z-index: 998; pointer-events: none; }

        /* --- HEADER --- */
        header { padding: 80px 5% 40px; text-align: center; }
        .logo-img { width: 120px; margin-bottom: 20px; opacity: 0.9; }
        .anniversary-tag { font-family: 'Playfair Display'; font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 400; }
        .anniversary-tag span { 
            background: linear-gradient(to right, var(--gold), var(--gold-bright), var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-style: italic; font-weight: 700;
        }

        /* --- MASONRY GRID --- */
        .scrapbook-container { padding: 0 8% 150px; max-width: 1600px; margin: 0 auto; position: relative; z-index: 2; }
        .grid { columns: 3; column-gap: 30px; }
        @media(max-width: 1100px) { .grid { columns: 2; } }
        @media(max-width: 700px) { .grid { columns: 1; } }

        .polaroid {
            break-inside: avoid;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 12px 60px 12px;
            margin-bottom: 30px;
            position: relative;
            transform: rotate(var(--r));
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .polaroid img { width: 100%; display: block; border-radius: 2px; cursor: zoom-in; }
        .polaroid:hover { transform: scale(1.05) rotate(0deg) !important; border-color: var(--gold); z-index: 10; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

        .caption {
            position: absolute; bottom: 20px; left: 15px;
            color: var(--gold-bright); font-family: 'Playfair Display';
            font-size: 0.85rem; letter-spacing: 1px;
            max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* --- WHATSAPP SHARE --- */
        .wa-share {
            position: absolute; bottom: 15px; right: 15px;
            background: rgba(37, 211, 102, 0.15);
            border: 1px solid rgba(37, 211, 102, 0.3);
            border-radius: 50%; width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s; cursor: pointer;
        }
        .wa-share:hover { background: #25D366; transform: scale(1.1); border-color: #25D366; }
        .wa-share svg { fill: white; width: 18px; height: 18px; }

        /* --- UI ELEMENTS --- */
        #fullPreview {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 10001; display: none; align-items: center; justify-content: center;
        }
        #fullPreview img { max-height: 90vh; max-width: 90vw; border: 1px solid var(--gold); box-shadow: 0 0 50px rgba(197, 160, 89, 0.2); }

        .manual-zone { text-align: center; margin-top: 20px; display: none; }
        .btn-manual { 
            background: none; border: 1px solid var(--gold); color: var(--gold); 
            padding: 10px 20px; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: 0.3s;
        }
        .btn-manual:hover { background: var(--gold); color: black; }

        footer { padding: 80px 50px; text-align: center; color: #444; font-size: 0.6rem; letter-spacing: 4px; border-top: 1px solid rgba(255,255,255,0.03); }
    </style>
</head>
<body>

<canvas id="fw-canvas"></canvas>
<div id="bg-memory-layer"></div>
<div class="cursor"></div>
<div class="cursor-follower"></div>

<div id="fullPreview" onclick="this.style.display='none'">
    <img id="previewImg" src="">
</div>

<header>
    <img src="SM NEW LOGO_20251221_144929_0000.png" alt="Logo" class="logo-img">
    <h1 class="anniversary-tag">The <span>10 Year</span> Archive</h1>
    <div class="manual-zone" id="manualZone">
        <p style="font-size: 0.7rem; color: #666; margin-bottom: 10px;">BROWSER BLOCKED AUTO-LOAD (LOCAL MODE)</p>
        <button class="btn-manual" onclick="document.getElementById('fileInput').click()">Select data.xlsx Manually</button>
        <input type="file" id="fileInput" hidden accept=".xlsx">
    </div>
</header>

<main class="scrapbook-container">
    <div id="status" style="text-align:center; opacity:0.7; font-size:0.9rem; font-family: 'Playfair Display';">Initiating Legacy Sequence...</div>
    <div class="grid" id="mainGrid"></div>
</main>

<footer>EST. 2016 • STUDENT MITRA • CELEBRATING A DECADE</footer>

<script>
    // --- CURSOR ---
    const dot = document.querySelector('.cursor');
    const ring = document.querySelector('.cursor-follower');
    document.addEventListener('mousemove', e => {
        dot.style.left = ring.style.left = e.clientX + 'px';
        dot.style.top = ring.style.top = e.clientY + 'px';
    });

    // --- ENHANCED DATA LOADING ---
    async function loadData() {
        const statusEl = document.getElementById('status');
        try {
            // Added a cache-busting parameter to ensure it always gets the latest version
            const response = await fetch('data.xlsx?v=' + Math.random());
            
            if (!response.ok) {
                throw new Error(`Server responded with ${response.status}`);
            }
            
            const arrayBuffer = await response.arrayBuffer();
            handleExcel(arrayBuffer);
            
        } catch (err) {
            console.error("Load Error:", err);
            statusEl.innerHTML = "Archive connection failed. <br><small style='color:red'>Make sure 'data.xlsx' is uploaded to the root folder.</small>";
            // Only show manual button if we are truly stuck
            document.getElementById('manualZone').style.display = 'block';
        }
    }

    function handleExcel(buffer) {
        try {
            const workbook = XLSX.read(new Uint8Array(buffer), {type: 'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet);
            
            if (json.length === 0) {
                document.getElementById('status').innerText = "The archive is empty.";
                return;
            }

            processData(json);
            document.getElementById('status').style.display = 'none';
            document.getElementById('manualZone').style.display = 'none';
            setTimeout(burstFireworks, 500);
        } catch (e) {
            document.getElementById('status').innerText = "Error reading Excel data.";
        }
    }

    // Manual upload listener (Backup)
    document.getElementById('fileInput').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (evt) => handleExcel(evt.target.result);
        reader.readAsArrayBuffer(e.target.files[0]);
    };

    function getThumb(u) {
        if (!u || typeof u !== 'string') return "";
        const idMatch = u.match(/(?:\/d\/|id=)([\w-]+)/);
        return idMatch ? `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1000` : u.trim();
    }

    function processData(data) {
        const grid = document.getElementById('mainGrid');
        const bgLayer = document.getElementById('bg-memory-layer');
        grid.innerHTML = ""; 

        data.forEach((row) => {
            // Checks multiple possible column names for compatibility
            const imgContent = row["Upload your Memorable Moment :"] || row["Image"] || row["link"] || Object.values(row).find(v => String(v).includes("drive.google.com"));
            const name = row["Name : "] || row["Name"] || "Legacy Member";

            if (imgContent) {
                const links = String(imgContent).split(',');
                links.forEach(link => {
                    const url = getThumb(link);
                    if (!url || url === "undefined" || url.length < 10) return;

                    const rot = (Math.random() * 6 - 3).toFixed(2);
                    const card = document.createElement('div');
                    card.className = 'polaroid';
                    card.style.setProperty('--r', `${rot}deg`);
                    card.innerHTML = `
                        <img src="${url}" onclick="openFull('${url}')" loading="lazy">
                        <div class="caption">${name}</div>
                        <div class="wa-share" onclick="shareWA('${url}', '${name}')">
                            <svg viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-5.5-2.8-23.2-8.5-44.2-27.1-16.4-14.6-27.4-32.7-30.6-38.2-3.2-5.6-.3-8.6 2.4-11.3 2.5-2.4 5.5-6.5 8.3-9.7 2.8-3.3 3.7-5.6 5.5-9.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 13.2 5.8 23.5 9.2 31.5 11.8 13.5 4.3 25.7 3.7 35.5 2.3 10.8-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
                        </div>
                    `;
                    grid.appendChild(card);

                    // BG Floating Effect
                    const bgImg = document.createElement('img');
                    bgImg.className = 'floating-mem';
                    bgImg.src = url;
                    bgImg.style.left = Math.random() * 100 + 'vw';
                    bgImg.style.top = Math.random() * 100 + 'vh';
                    bgImg.style.setProperty('--mx', (Math.random() * 400 - 200) + 'px');
                    bgImg.style.setProperty('--my', (Math.random() * 400 - 200) + 'px');
                    bgImg.style.animationDuration = (Math.random() * 20 + 20) + 's';
                    bgLayer.appendChild(bgImg);
                });
            }
        });
    }

    function shareWA(url, name) {
        const text = encodeURIComponent(`✨ Reliving a moment from the StudentMitra Legacy Archive: "${name}" \n\nView Image: ${url}`);
        window.open(`https://wa.me/?text=${text}`, '_blank');
    }

    function openFull(url) {
        document.getElementById('previewImg').src = url;
        document.getElementById('fullPreview').style.display = 'flex';
    }

    // --- FIREWORKS ---
    const canvas = document.getElementById('fw-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();

    function burstFireworks() {
        for(let i=0; i<6; i++) {
            setTimeout(() => {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                for(let j=0; j<30; j++) {
                    particles.push({
                        x, y, 
                        v: { x: (Math.random()-0.5)*12, y: (Math.random()-0.5)*12 },
                        a: 1
                    });
                }
            }, i * 350);
        }
    }

    function animate() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        particles.forEach((p, i) => {
            p.x += p.v.x; p.y += p.v.y; p.a -= 0.015;
            if(p.a <= 0) particles.splice(i, 1);
            else {
                ctx.globalAlpha = p.a;
                ctx.fillStyle = '#f3d081';
                ctx.fillRect(p.x, p.y, 2, 2);
            }
        });
        requestAnimationFrame(animate);
    }
    animate();
    
    // Start the process
    window.onload = loadData;
</script>
</body>
</html>
